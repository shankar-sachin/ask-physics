name: Website

# Builds askphysics.vercel.app and drives it in headless Chromium against the
# real Pyodide CDN and PyPI: the page boots Python and answers questions.
on:
  pull_request:
    paths:
      - "web/**"
      - "src/askphysics/**"
      - "scripts/build_site.sh"
      - "scripts/site_smoke.mjs"
      - "vercel.json"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/askphysics/**"
      - "scripts/build_site.sh"
      - "scripts/site_smoke.mjs"
      - "vercel.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the site
        run: sh scripts/build_site.sh
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Ask questions through the page
        run: node scripts/site_smoke.mjs
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-smoke
          path: build/site-smoke.png
          if-no-files-found: ignore
