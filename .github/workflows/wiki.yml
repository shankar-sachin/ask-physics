name: Wiki

# Publishes docs/wiki/ plus the pages generated from the equation database
# (scripts/build_wiki.py) to the repository's GitHub Wiki. The wiki is a copy:
# edits made there are overwritten here.
on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - "docs/GLOSSARY.md"
      - "src/askphysics/data/equations.json"
      - "src/askphysics/data/constants.json"
      - "scripts/build_wiki.py"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the pages
        run: python scripts/build_wiki.py build/wiki
      - name: Publish to the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" build/wiki-repo
          rsync -a --delete --exclude .git build/wiki/ build/wiki-repo/
          cd build/wiki-repo
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date."
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish the wiki from ${GITHUB_SHA}"
          git push origin HEAD
