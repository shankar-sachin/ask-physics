[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "askphysics"
version = "0.1.0"
description = "Answers physics questions, from textbook to absurd, with retrieved equations and symbolic math instead of LLM arithmetic."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sachin Shankar" }]
keywords = ["physics", "llm", "rag", "sympy", "pint", "fermi-estimation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "sympy>=1.13",
    "pint>=0.24",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
askphysics = "askphysics.cli:app"

[project.urls]
Homepage = "https://github.com/shankar-sachin/ask-physics"
Issues = "https://github.com/shankar-sachin/ask-physics/issues"
Changelog = "https://github.com/shankar-sachin/ask-physics/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/askphysics"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["askphysics"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.format]
# Code blocks in docs are compact illustrative signatures, not source.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "PTH", # use pathlib
]

[tool.ruff.lint.per-file-ignores]
# Physics symbols are conventionally single uppercase letters (F, G, R, T).
"src/askphysics/solver/*.py" = ["N802", "N803", "N806"]
"tests/*.py" = ["N802", "N803", "N806"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# See ADR-007 in docs/DECISIONS.md: incomplete third-party type information.
module = ["sympy.*", "anthropic.*"]
ignore_missing_imports = true
