[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "askphysics"
version = "0.2.0"
description = "Answers physics questions, from textbook to absurd, with our own small language models and a symbolic algebra machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Sachin Shankar" }]
keywords = ["physics", "llm", "rag", "sympy", "pint", "fermi-estimation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "sympy>=1.13",
    "pint>=0.24",
    "typer>=0.12",
    "rich>=13.7",
    "torch>=2.4",
    "safetensors>=0.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
askphysics = "askphysics.cli:app"

[project.urls]
Homepage = "https://github.com/shankar-sachin/ask-physics"
Issues = "https://github.com/shankar-sachin/ask-physics/issues"
Changelog = "https://github.com/shankar-sachin/ask-physics/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/askphysics"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config"]

[tool.coverage.run]
source = ["askphysics"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

# ---------------------------------------------------------------- ruff
# uv (the one-line installers and the Homebrew formula) takes torch on Linux from
# PyTorch's CPU-only index; the PyPI wheel bundles ~2 GB of CUDA the CLI never uses.
# Only torch comes from there (explicit = true). pip ignores this table.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "evals"]

[tool.ruff.format]
# Code blocks in docs are compact illustrative signatures, not source.
exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "PTH", # use pathlib
]

[tool.ruff.lint.per-file-ignores]
# Physics symbols are conventionally single uppercase letters (F, G, R, T).
"src/askphysics/solver/*.py" = ["N802", "N803", "N806"]
"tests/*.py" = ["N802", "N803", "N806"]
# `import torch.nn.functional as F` is the PyTorch convention.
"src/askphysics/lm/*.py" = ["N812"]
# The terminal UI uses real typography on purpose (×, superscripts, box glyphs).
"src/askphysics/ui.py" = ["RUF001", "RUF002", "RUF003"]
"src/askphysics/pretty.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_ui.py" = ["RUF001"]
"tests/test_pretty.py" = ["RUF001"]
"tests/test_web.py" = ["RUF001"]
# The artwork typesets real equations (Greek letters), one long HTML row per equation.
"scripts/brand.py" = ["RUF001", "E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
files = ["src", "evals"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# See ADR-007 in docs/DECISIONS.md: incomplete third-party type information.
module = ["sympy.*"]
ignore_missing_imports = true
